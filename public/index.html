<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Node.JS Express.JS PostgreSQL</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fanta.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <section id="auth">
        <div>
            <h2 className="sign-up-text">Login</h2>
            <p>Create an account!</p>
        </div>

        <p id="error" style="display: none;"></p>
        <input id="emailInput" placeholder="Email" />
        <input id="passwordInput" placeholder="********" type="password" />
        <button id="authBtn" onclick="authenticate()">
            Submit
        </button>
        <hr />
        <div class="register-content">
            <p>Don&apos;t have an account?</p>
            <button onclick="toggleIsRegister()" id="registerBtn">Sign up</button>
        </div>
    </section>
    <header style="display: none;">
        <h1 class="text-gradient">You have 0 expenses.</h1>
    </header>
    <main style="display: none;">


    </main>
</body>
<script>
    let token = localStorage.getItem('token')

    let isLoading = false
    let isAuthenticating = false
    let isRegistration = false
    let expenses = []

    const apiBase = '/'

    // elements
    const header = document.querySelector('header')
    const main = document.querySelector('main')
    const authContent = document.getElementById('auth')
    const error = document.getElementById('error')
    const email = document.getElementById('emailInput')
    const password = document.getElementById('passwordInput')
    const registerBtn = document.getElementById('registerBtn')
    const authBtn = document.getElementById('authBtn')

    // PAGE RENDERING LOGIC
    async function showDashboard() {
        header.style.display = 'flex'
        main.style.display = 'flex'
        authContent.style.display = 'none'

        await fetchExpenses()
    }

    function updateHeaderText() {
        const total = expenses.reduce((sum, val) => sum + val.amount, 0)
        const newString = expenses.length === 1 ?
            `You have 1 expense. Total: $${total.toFixed(2)}` :
            `You have ${expenses.length} expenses. Total: $${total.toFixed(2)}`
        header.querySelector('h1').innerText = newString
    }

    function renderExpenses() {
        updateHeaderText()

        let expenseList = ``
        expenses.forEach((expense) => {
            expenseList += `
            <div class="card expense-item">
                <p>${expense.title}</p>
                <div class="expense-buttons">
                    <p>$${expense.amount.toFixed(2)}</p>
                    <button onclick="deleteExpense(${expense.id})">
                        <h6>Delete</h6>
                    </button>
                </div>
            </div>
            `
        })
        expenseList += `
        <div class="input-container">
            <input id="titleInput" placeholder="Title" />
            <input id="amountInput" placeholder="Amount" type="number" step="0.01" />
            <button onclick="addExpense()">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        `
        main.innerHTML = expenseList
    }

    // showDashboard()

    // AUTH LOGIC

    async function toggleIsRegister() {
        isRegistration = !isRegistration
        registerBtn.innerText = isRegistration ? 'Sign in' : 'Sign up'
        document.querySelector('#auth > div h2').innerText = isRegistration ? 'Sign Up' : 'Login'
        document.querySelector('.register-content p').innerText = isRegistration ? 'Already have an account?' : 'Don\'t have an account?'
        document.querySelector('.register-content button').innerText = isRegistration ? 'Sign in' : 'Sign up'
    }

    async function authenticate() {
        // access email and pass values
        const emailVal = email.value
        const passVal = password.value

        // guard clauses... if authenticating, return
        if (
            isLoading ||
            isAuthenticating ||
            !emailVal ||
            !passVal ||
            passVal.length < 6 ||
            !emailVal.includes('@')
        ) { return }

        // reset error and set isAuthenticating to true
        error.style.display = 'none'
        isAuthenticating = true
        authBtn.innerText = 'Authenticating...'

        try {
            let data
            if (isRegistration) {
                // register an account
                const response = await fetch(apiBase + 'auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: emailVal, password: passVal })
                })
                data = await response.json()
            } else {
                // login an account
                const response = await fetch(apiBase + 'auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: emailVal, password: passVal })
                })
                data = await response.json()
            }

            if (data.token) {
                token = data.token
                localStorage.setItem('token', token)

                // authenicating into loading
                authBtn.innerText = 'Loading...'

                // fetch expenses
                await fetchExpenses()

                // show dashboard
                showDashboard()
            } else {
                throw Error('❌ Failed to authenticate...')
            }

        } catch (err) {
            console.log(err.message)
            error.innerText = err.message
            error.style.display = 'block'
        } finally {
            authBtn.innerText = 'Submit'
            isAuthenticating = false
        }


    }

    function logout() {
        // wipe states and clear cached token
    }

    // CRUD LOGIC

    async function fetchExpenses() {
        isLoading = true
        const response = await fetch(apiBase + 'expenses', {
            headers: { 'Authorization': token }
        })
        const expensesData = await response.json()
        expenses = expensesData
        isLoading = false
        renderExpenses()
    }

    async function deleteExpense(index) {
        await fetch(apiBase + 'expenses' + '/' + index, {
            method: 'DELETE',
            headers: {
                'Authorization': token
            },
        })
        fetchExpenses()
    }

    async function addExpense() {
        // have to access these vals later as they're rendered with js
        const titleInput = document.getElementById('titleInput')
        const amountInput = document.getElementById('amountInput')
        const title = titleInput.value
        const amount = parseFloat(amountInput.value)

        if (!title || isNaN(amount)) { return }

        await fetch(apiBase + 'expenses', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': token
            },
            body: JSON.stringify({ title, amount })
        })
        titleInput.value = ''
        amountInput.value = ''
        fetchExpenses()
    }

    // UTILITY FUNCTIONS


    // load page and read local storage for key

    // default to login screen

    // if is authenticated, show expense app
    if (token) {
        async function run() {
            await fetchExpenses()
            showDashboard()
        }
        run()
    }
</script>

</html>
